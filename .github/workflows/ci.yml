name: Verify calculator

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, regression, and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Solver and API regression
        run: npm test
      - name: Build cacheable web deployment
        run: npm run build
      - name: Build offline single file
        run: npm run build:offline
      - name: Reject whitespace errors
        run: git diff --check
